<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 28px;
        }

        .input-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
            font-size: 14px;
        }

        input[type="text"], input[type="url"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus, input[type="url"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .button-group button {
            flex: 1;
        }

        .copy-btn {
            background: #f59e0b;
            display: none;
        }

        .copy-btn:hover {
            box-shadow: 0 5px 15px rgba(245, 158, 11, 0.4);
        }

        .history-section {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #e0e0e0;
        }

        .history-section h3 {
            color: #333;
            font-size: 18px;
            margin-bottom: 15px;
        }

        .history-list {
            max-height: 200px;
            overflow-y: auto;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: #f9fafb;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .history-item span {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            margin-right: 10px;
        }

        .history-item button {
            padding: 6px 12px;
            font-size: 12px;
            width: auto;
        }

        .clear-history-btn {
            background: #ef4444;
            margin-top: 10px;
        }

        .clear-history-btn:hover {
            box-shadow: 0 5px 15px rgba(239, 68, 68, 0.4);
        }

        .option-group {
            display: flex;
            flex-direction: column;
        }

        select, input[type="number"] {
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        select:focus, input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        #qrcode-container {
            margin-top: 30px;
            text-align: center;
            min-height: 256px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #qrcode {
            display: inline-block;
            padding: 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .download-btn {
            margin-top: 20px;
            background: #10b981;
            display: none;
        }

        .download-btn:hover {
            box-shadow: 0 5px 15px rgba(16, 185, 129, 0.4);
        }

        .placeholder {
            color: #999;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔲 QR Code Generator</h1>

        <div class="input-group">
            <label for="text-input">Enter Text or URL</label>
            <input type="text" id="text-input" placeholder="https://example.com or any text" value="https://imperial.eu.qualtrics.com/jfe/form/SV_9n3LzLU7IOqN2Ci">
        </div>

        <div class="options">
            <div class="option-group">
                <label for="size-input">Size (px)</label>
                <input type="number" id="size-input" value="384" min="128" max="512" step="32">
            </div>
            <div class="option-group">
                <label for="color-input">Foreground Color</label>
                <select id="color-input">
                    <option value="#000000">Black</option>
                    <option value="#667eea">Purple</option>
                    <option value="#10b981">Green</option>
                    <option value="#ef4444">Red</option>
                    <option value="#3b82f6">Blue</option>
                </select>
            </div>
            <div class="option-group">
                <label for="bg-color-input">Background Color</label>
                <select id="bg-color-input">
                    <option value="#ffffff">White</option>
                    <option value="#f3f4f6">Light Gray</option>
                    <option value="#fef3c7">Light Yellow</option>
                    <option value="#dbeafe">Light Blue</option>
                    <option value="#fce7f3">Light Pink</option>
                </select>
            </div>
            <div class="option-group">
                <label for="error-level-input">Error Correction</label>
                <select id="error-level-input">
                    <option value="L">Low (7%)</option>
                    <option value="M">Medium (15%)</option>
                    <option value="Q">Quartile (25%)</option>
                    <option value="H" selected>High (30%)</option>
                </select>
            </div>
        </div>

        <button onclick="generateQR()">Generate QR Code</button>

        <div id="qrcode-container">
            <div id="qrcode"></div>
            <div class="button-group">
                <button class="copy-btn" id="copy-btn" onclick="copyQR()">Copy to Clipboard</button>
                <button class="download-btn" id="download-btn" onclick="downloadQR()">Download PNG</button>
            </div>
        </div>

        <div class="history-section" id="history-section" style="display: none;">
            <h3>Recent QR Codes</h3>
            <div class="history-list" id="history-list"></div>
            <button class="clear-history-btn" onclick="clearHistory()">Clear History</button>
        </div>
    </div>

    <script>
        let qrcode = null;
        const HISTORY_KEY = 'qr-code-history';
        const MAX_HISTORY = 10;

        // Load history on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadHistory();
        });

        function generateQR() {
            const text = document.getElementById('text-input').value.trim();
            const size = parseInt(document.getElementById('size-input').value);
            const color = document.getElementById('color-input').value;
            const bgColor = document.getElementById('bg-color-input').value;
            const errorLevel = document.getElementById('error-level-input').value;
            const qrcodeDiv = document.getElementById('qrcode');
            const downloadBtn = document.getElementById('download-btn');
            const copyBtn = document.getElementById('copy-btn');

            if (!text) {
                alert('Please enter some text or URL');
                return;
            }

            // Clear previous QR code
            qrcodeDiv.innerHTML = '';
            downloadBtn.style.display = 'none';
            copyBtn.style.display = 'none';

            // Generate new QR code
            qrcode = new QRCode(qrcodeDiv, {
                text: text,
                width: size,
                height: size,
                colorDark: color,
                colorLight: bgColor,
                correctLevel: QRCode.CorrectLevel[errorLevel]
            });

            // Show buttons after a brief delay to ensure QR code is rendered
            setTimeout(() => {
                downloadBtn.style.display = 'block';
                copyBtn.style.display = 'block';

                // Save to history
                saveToHistory(text, { size, color, bgColor, errorLevel });
            }, 100);
        }

        function downloadQR() {
            const canvas = document.querySelector('#qrcode canvas');
            if (!canvas) {
                alert('Please generate a QR code first');
                return;
            }

            // Convert canvas to blob and download
            canvas.toBlob(function(blob) {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'qualtrics-survey-qrcode.png';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            });
        }

        function copyQR() {
            const canvas = document.querySelector('#qrcode canvas');
            if (!canvas) {
                alert('Please generate a QR code first');
                return;
            }

            // Convert canvas to blob and copy to clipboard
            canvas.toBlob(function(blob) {
                const item = new ClipboardItem({ 'image/png': blob });
                navigator.clipboard.write([item]).then(() => {
                    // Show feedback
                    const copyBtn = document.getElementById('copy-btn');
                    const originalText = copyBtn.textContent;
                    copyBtn.textContent = 'Copied!';
                    setTimeout(() => {
                        copyBtn.textContent = originalText;
                    }, 2000);
                }).catch(err => {
                    alert('Failed to copy to clipboard. Your browser may not support this feature.');
                });
            });
        }

        function saveToHistory(text, options) {
            try {
                let history = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');

                // Add new item to the beginning
                history.unshift({
                    text: text,
                    options: options,
                    timestamp: new Date().toISOString()
                });

                // Keep only MAX_HISTORY items
                history = history.slice(0, MAX_HISTORY);

                localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
                loadHistory();
            } catch (e) {
                console.error('Failed to save to history:', e);
            }
        }

        function loadHistory() {
            try {
                const history = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
                const historySection = document.getElementById('history-section');
                const historyList = document.getElementById('history-list');

                if (history.length === 0) {
                    historySection.style.display = 'none';
                    return;
                }

                historySection.style.display = 'block';
                historyList.innerHTML = '';

                history.forEach((item, index) => {
                    const div = document.createElement('div');
                    div.className = 'history-item';

                    const span = document.createElement('span');
                    span.textContent = item.text;
                    span.title = item.text;

                    const button = document.createElement('button');
                    button.textContent = 'Load';
                    button.onclick = () => loadHistoryItem(index);

                    div.appendChild(span);
                    div.appendChild(button);
                    historyList.appendChild(div);
                });
            } catch (e) {
                console.error('Failed to load history:', e);
            }
        }

        function loadHistoryItem(index) {
            try {
                const history = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
                const item = history[index];

                if (!item) return;

                document.getElementById('text-input').value = item.text;
                document.getElementById('size-input').value = item.options.size;
                document.getElementById('color-input').value = item.options.color;
                document.getElementById('bg-color-input').value = item.options.bgColor;
                document.getElementById('error-level-input').value = item.options.errorLevel;

                generateQR();
            } catch (e) {
                console.error('Failed to load history item:', e);
            }
        }

        function clearHistory() {
            if (confirm('Are you sure you want to clear the history?')) {
                localStorage.removeItem(HISTORY_KEY);
                loadHistory();
            }
        }

        // Allow Enter key to generate QR code
        document.getElementById('text-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                generateQR();
            }
        });
    </script>
</body>
</html>
